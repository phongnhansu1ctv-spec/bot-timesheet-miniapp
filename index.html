<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Bot Timesheet</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{font-family:-apple-system,sans-serif;margin:0;padding:16px;background:var(--tg-theme-bg-color,#fff);color:var(--tg-theme-text-color,#000);}
h3{margin:0 0 4px;}
.sub{color:var(--tg-theme-hint-color,#888);font-size:13px;margin:0 0 16px;}
.row{display:flex;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--tg-theme-hint-color,#eee);}
.info{flex:1;padding-right:8px;min-width:0;}
.name{font-weight:600;font-size:15px;}
.desc{color:var(--tg-theme-hint-color,#888);font-size:12px;margin-top:2px;}
.row input.hours{width:64px;height:36px;text-align:right;font-size:16px;border:1px solid var(--tg-theme-hint-color,#ccc);border-radius:6px;background:var(--tg-theme-bg-color,#fff);color:var(--tg-theme-text-color,#000);}
.pick{padding:12px 0;border-bottom:1px solid var(--tg-theme-hint-color,#eee);position:relative;}
.pickhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.pickhead label{font-size:13px;color:var(--tg-theme-hint-color,#888);}
.pick input.search{width:100%;box-sizing:border-box;height:40px;font-size:16px;padding:0 12px;border:1px solid var(--tg-theme-hint-color,#ccc);border-radius:8px;background:var(--tg-theme-bg-color,#fff);color:var(--tg-theme-text-color,#000);}
.results{margin-top:4px;border:1px solid var(--tg-theme-hint-color,#ddd);border-radius:8px;max-height:260px;overflow-y:auto;background:var(--tg-theme-secondary-bg-color,#f7f7f7);}
.res-item{padding:10px 12px;border-bottom:1px solid var(--tg-theme-hint-color,#eee);cursor:pointer;}
.res-item:last-child{border-bottom:none;}
.res-name{font-size:15px;}
.res-desc{color:var(--tg-theme-hint-color,#888);font-size:12px;margin-top:2px;}
.res-note{padding:10px 12px;font-size:12px;color:var(--tg-theme-hint-color,#888);}
.count{color:var(--tg-theme-hint-color,#888);font-size:13px;margin:12px 0 0;}
.note{font-size:13px;line-height:1.45;margin:0 0 12px;}
.daybar{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
.daybar h3{flex:1;text-align:center;font-size:17px;margin:0;}
button.nav{width:40px;height:36px;margin:0;padding:0;background:transparent;color:var(--tg-theme-text-color,#000);font-size:26px;line-height:1;flex:none;}
button.nav:disabled{opacity:0.2;}
textarea#lyDo{width:100%;box-sizing:border-box;font-size:16px;font-family:inherit;padding:8px 12px;margin-top:6px;border:1px solid var(--tg-theme-hint-color,#ccc);border-radius:8px;background:var(--tg-theme-bg-color,#fff);color:var(--tg-theme-text-color,#000);resize:vertical;}
.radio{display:block;padding:8px 0;font-size:15px;}
.radio input{margin-right:8px;}
.savedtitle{font-weight:600;font-size:15px;margin:8px 0 2px;}
.note.warn{color:#b26a00;}
h4.khoi{margin:18px 0 0;font-size:15px;}
#total,#totalO{display:flex;justify-content:space-between;padding:14px 0 4px;font-weight:600;}
.hint{font-size:12px;color:#e53935;margin:0 0 4px;min-height:14px;}
button{width:100%;height:44px;border:none;border-radius:8px;background:var(--tg-theme-button-color,#2481cc);color:var(--tg-theme-button-text-color,#fff);font-size:15px;margin-top:8px;}
button:disabled{opacity:0.4;}
button.secondary{background:transparent;color:var(--tg-theme-button-color,#2481cc);border:1px solid var(--tg-theme-button-color,#2481cc);}
button.x{width:32px;height:32px;margin:0 0 0 8px;padding:0;background:transparent;color:var(--tg-theme-hint-color,#888);font-size:20px;line-height:1;flex:none;}
.msg{text-align:center;padding:40px 0;color:var(--tg-theme-hint-color,#888);}
.error{color:#e53935;}
.ok{color:#2e7d32;}
#ver{margin:28px 0 0;text-align:center;font-size:11px;color:var(--tg-theme-hint-color,#888);}
</style>
</head>
<body>
<div id="app"><p class="msg">Đang tải...</p></div>
<p id="dmWrap" style="display:none"><button id="dmThangBtn" class="secondary" style="display:none">⭐ Dự án của tôi</button><button id="dmBtn" class="secondary">📋 Danh mục dự án</button><button id="slBtn" class="secondary" style="display:none">✏️ Yêu cầu sửa timesheet</button></p>
<p id="ver"></p>
<script>
// ĐÃ GẮN SẴN URL Apps Script hiện tại - nếu sau này đổi deployment/WEB_APP_URL, phải sửa đúng dòng này
// rồi tải lại file này lên GitHub Pages (không tự đồng bộ với Script Properties bên Apps Script).
var API_URL = "https://script.google.com/macros/s/AKfycbzbUMVtBrj3qXS-R6kmHLNY0S9OnnR_CagHrGjOgd5NJfxJ8X0Jj8dVRWUvrwiehkje/exec";

// Phiên bản giao diện - đổi số này mỗi lần sửa file; khớp với PHIEN_BAN_MAY_CHU trong 07_MiniAppApi.gs.
// Hiện ở chân trang để biết ngay trang đang mở có đúng bản mới nhất không (GitHub Pages / Telegram có cache).
var CLIENT_VERSION = "2026-11-06.1";

var BUOC_GIO = 0.5; // mỗi dự án chỉ nhập bội số của 0,5 giờ (đã chốt 2026-10-05); máy chủ cũng kiểm tra lại
var MAX_RESULTS = 10; // số dự án tối đa hiện trong danh sách gợi ý mỗi lần tìm

var tg = window.Telegram ? window.Telegram.WebApp : null;
var state = { dat: null, daGop: [], thongBao: "", hoTen: "", available: 8, projects: [], byId: {}, days: [], di: 0, rows: [newRow()], otRows: [newRow()], editing: false, drafts: {}, lyDoBoSung: "", lyDoDc: "", lyDoDcKhac: "" };
// Lý do điều chỉnh hồi tố (Q-61) - máy chủ gửi kèm danh sách trong từng ngày; đây là dự phòng
var LY_DO_DC_MAC_DINH = ["Theo chấm công", "Đơn duyệt sau khi khoá", "Quên sửa", "Khác"];
// Mở từ tin nhắc 1 ngày cụ thể (nút có ?ngay=yyyy-MM-dd, chốt 26/10/2026): chỉ hiện ngày đó, lưu xong báo các ngày còn cần điền.
// Mở từ /timesheet hoặc menu (không có ?ngay=): như cũ, hiện tất cả ngày, mở ở hôm nay.
function xemTuDuongDan() {
  try { return new URLSearchParams(window.location.search).get("xem") || ""; } catch (e) { return ""; }
}
// Tên để tìm: tên hiện tại + tên các dự án đã gộp vào (chốt 29/10/2026, Q-83)
function tenTimKiem(p) { return [p.TenDuAn].concat(p.TenCu || []); }
function khopTen(p, tokens) {
  return tenTimKiem(p).filter(function (t) { var n = norm(t); return tokens.every(function (k) { return n.indexOf(k) !== -1; }); });
}
// ---- Tìm dự án (chốt 06/11/2026): ưu tiên khớp TÊN (kể cả tên cũ đã gộp), rồi khớp MÔ TẢ, rồi khớp MÃ ----
// Trả mức khớp: 0 = tên, 1 = mô tả, 2 = mã; -1 = không khớp. Không gõ gì: mọi dự án đều khớp ở mức 0.
function mucKhopDuAn(p, tokens) {
  if (!tokens.length || khopTen(p, tokens).length) return 0;
  var mt = norm(p.MoTa || "");
  if (mt && tokens.every(function (t) { return mt.indexOf(t) !== -1; })) return 1;
  if (tokens.every(function (t) { return norm(p.ProjectID).indexOf(t) !== -1; })) return 2;
  return -1;
}
// Lọc + sắp xếp danh sách dự án theo mức khớp (giữ thứ tự gốc trong cùng mức); boQua = mảng ProjectID đã chọn
function timDuAn(list, tokens, boQua) {
  return list.map(function (p, i) { return { p: p, m: (boQua || []).indexOf(p.ProjectID) >= 0 ? -1 : mucKhopDuAn(p, tokens), i: i }; })
    .filter(function (x) { return x.m >= 0; })
    .sort(function (a, b) { return a.m - b.m || a.i - b.i; })
    .map(function (x) { return x.p; });
}
// 1 dòng gợi ý dự án, trình bày như màn Danh mục: tên (đã gộp từ…) / mã · phụ trách / mô tả
function ketQuaDuAnHtml(p, tokens) {
  var k = tokens.length ? khopTen(p, tokens) : [];
  return '<div class="res-item" data-id="' + esc(p.ProjectID) + '"><div class="res-name">' + esc(p.TenDuAn) +
    (k.length && k.indexOf(p.TenDuAn) < 0 ? ' (đã gộp từ ' + esc(k.join(", ")) + ')' : '') + '</div>' +
    '<div class="res-desc">' + esc(p.ProjectID) + (p.PhuTrach ? ' · Phụ trách: ' + esc(p.PhuTrach) : '') + '</div>' +
    '<div class="res-desc">' + (p.MoTa ? esc(p.MoTa) : '(Chưa có mô tả)') + '</div></div>';
}
function chiTietDuAnHtml(p) { // mã · phụ trách + mô tả cho dòng dự án đã chọn
  return '<div class="desc">' + esc(p.ProjectID || '') + (p.PhuTrach ? ' · Phụ trách: ' + esc(p.PhuTrach) : '') + '</div>' +
    '<div class="desc">' + esc(p.MoTa || "(Chưa có mô tả)") + '</div>';
}

function ngayVN(n) { var x = String(n || "").split("-"); return x.length === 3 ? x[2] + "/" + x[1] + "/" + x[0] : ""; }

// Màn Danh mục dự án: nhóm theo Phân loại, có tìm kiếm, mục "Đã gộp"
function showDanhMuc() {
  var html = '<div class="daybar"><button id="dmBack" class="nav" title="Quay lại">‹</button><h3>Danh mục dự án</h3><span style="width:40px"></span></div>' +
    '<p class="sub">' + state.projects.length + ' dự án đang dùng' + (state.daGop.length ? ' · ' + state.daGop.length + ' dự án đã gộp' : '') + '</p>' +
    '<input type="text" class="search" id="dmSearch" placeholder="Gõ để tìm dự án..." autocomplete="off"><div id="dmList"></div>';
  $("app").innerHTML = html;
  $("dmBack").addEventListener("click", function () {
    if (state.days.length) showDay(); else showMessage(state.thongBao || "Hôm nay không có ngày cần điền timesheet.");
  });
  $("dmSearch").addEventListener("input", veDanhMuc);
  veDanhMuc();
}

function veDanhMuc() {
  var tokens = norm($("dmSearch").value).split(/\s+/).filter(Boolean);
  var nhom = {};
  state.projects.forEach(function (p) {
    if (mucKhopDuAn(p, tokens) < 0) return; // tìm theo tên, mô tả hoặc mã
    var k = p.PhanLoai || "Khác";
    (nhom[k] = nhom[k] || []).push(p);
  });
  var keys = Object.keys(nhom).sort(function (a, b) { return a === "Khác" ? 1 : b === "Khác" ? -1 : (a < b ? -1 : 1); });
  var html = "";
  keys.forEach(function (k) {
    html += '<h4 class="khoi">' + esc(k) + ' (' + nhom[k].length + ')</h4>';
    nhom[k].sort(function (a, b) { return String(a.TenDuAn).localeCompare(String(b.TenDuAn), "vi"); }).forEach(function (p) {
      html += '<div class="row"><div class="info"><div class="name">' + esc(p.TenDuAn) + '</div>' +
        '<div class="desc">' + esc(p.ProjectID) + (p.PhuTrach ? ' · Phụ trách: ' + esc(p.PhuTrach) : '') + '</div>' +
        (p.TenCu && p.TenCu.length ? '<div class="desc">Đã gộp từ: ' + esc(p.TenCu.join(", ")) + '</div>' : '') +
        '<div class="desc">' + (p.MoTa ? esc(p.MoTa) : '(Chưa có mô tả)') + '</div></div></div>';
    });
  });
  var gop = state.daGop.filter(function (g) {
    var n = norm(g.TenDuAn + " " + g.VaoTen);
    return tokens.every(function (t) { return n.indexOf(t) !== -1; });
  });
  if (gop.length) {
    html += '<h4 class="khoi">🔀 Đã gộp (' + gop.length + ')</h4>';
    gop.forEach(function (g) {
      html += '<div class="row"><div class="info"><div class="name">' + esc(g.TenDuAn) + ' → ' + esc(g.VaoTen) + '</div>' +
        '<div class="desc">' + esc(g.ProjectID) + ' → ' + esc(g.VaoID) + '</div>' +
        (g.NgayGop ? '<div class="desc">Từ ' + esc(ngayVN(g.NgayGop)) + '</div>' : '') + '</div></div>';
    });
  }
  $("dmList").innerHTML = html || '<p class="note">Không tìm thấy dự án phù hợp.</p>';
}

// ---- Dự án của tôi theo tháng (chốt 30/10/2026, Q-84) ----
function dsThangCua(ngay) { return state.dat && state.dat.ds ? (state.dat.ds[String(ngay).substring(0, 7)] || null) : null; }
function tenThangVN(thang) { var x = String(thang).split("-"); return "tháng " + Number(x[1]); }
function veLaiSauChon() { if (state.days.length) { delete state.drafts[cur().ngay]; showDay(); } else showMessage(state.thongBao || "Hôm nay không có ngày cần điền timesheet."); }

// Màn chọn danh sách dự án của tháng. suaLai = mở từ nút "⭐ Dự án của tôi" (có nút Huỷ thay cho Bỏ qua).
function showChonDuAnThang(thang, ids, suaLai, sauKhi) {
  var chon = ids.filter(function (id) { return state.byId[id]; });
  function ve() {
    var html = '<h3>⭐ Dự án của bạn ' + esc(tenThangVN(thang)) + '</h3>' +
      '<p class="sub">Chọn các dự án bạn sẽ làm trong ' + esc(tenThangVN(thang)) + '. Hằng ngày form điền giờ sẽ hiện sẵn các dự án này; ngày nào không làm thì bấm × để bỏ.</p>';
    if (!suaLai && chon.length) html += '<p class="note">Gợi ý từ danh sách tháng trước, bạn sửa lại nếu cần.</p>';
    if (state.dat && state.dat.ghiChu && state.dat.ghiChu.length) html += '<p class="note warn">' + esc(state.dat.ghiChu.join("; ")) + '.</p>';
    chon.forEach(function (id, i) {
      var p = state.byId[id];
      html += '<div class="row"><div class="info"><div class="name">' + esc(p.TenDuAn) + '</div>' + chiTietDuAnHtml(p) +
        '</div><button class="x" data-bo="' + i + '" title="Bỏ khỏi danh sách">×</button></div>';
    });
    html += '<div class="pick"><div class="pickhead"><label>Thêm dự án</label></div>' +
      '<input type="text" class="search" id="dtSearch" placeholder="Gõ để tìm dự án..." autocomplete="off"><div class="results" id="dtRes" style="display:none"></div></div>' +
      '<p class="count">Đã chọn: ' + chon.length + ' dự án</p>' +
      '<button id="dtLuu">Lưu danh sách</button><button id="dtBoQua" class="secondary">' + (suaLai ? 'Huỷ' : 'Bỏ qua') + '</button><p class="hint" id="dtLoi"></p>';
    $("app").innerHTML = html;
    Array.prototype.forEach.call($("app").querySelectorAll("[data-bo]"), function (b) {
      b.addEventListener("click", function () { chon.splice(parseInt(b.getAttribute("data-bo"), 10), 1); ve(); });
    });
    $("dtSearch").addEventListener("input", function () {
      var tokens = norm($("dtSearch").value).split(/\s+/).filter(Boolean);
      if (!tokens.length) { $("dtRes").style.display = "none"; return; }
      var ds = timDuAn(state.projects, tokens, chon).slice(0, MAX_RESULTS);
      $("dtRes").innerHTML = ds.length ? ds.map(function (p) { return ketQuaDuAnHtml(p, tokens);
      }).join("") : '<div class="res-note">Không tìm thấy dự án phù hợp.</div>';
      $("dtRes").style.display = "block";
    });
    $("dtRes").addEventListener("click", function (e) {
      var it = e.target.closest(".res-item");
      if (it) { chon.push(it.getAttribute("data-id")); ve(); }
    });
    $("dtLuu").addEventListener("click", function () { luuDuAnThang(thang, chon, sauKhi); });
    $("dtBoQua").addEventListener("click", function () { if (suaLai) sauKhi(); else luuDuAnThang(thang, [], sauKhi); });
  }
  ve();
}

function luuDuAnThang(thang, ids, sauKhi) {
  callApi("luuDuAnThang", { thang: thang, ids: ids }).then(function (res) {
    if (!res.ok) { if ($("dtLoi")) $("dtLoi").textContent = res.error || "Không lưu được danh sách."; else sauKhi(); return; }
    state.dat.ds[res.thang] = res.ids;
    if (res.thang === state.dat.thang) { state.dat.daChon = true; state.dat.ghiChu = []; }
    sauKhi();
  }).catch(function (err) { if ($("dtLoi")) $("dtLoi").textContent = "Lỗi kết nối: " + err; else sauKhi(); });
}

// Lưu xong 1 ngày mà khác danh sách tháng: hỏi có thêm vào / bỏ khỏi danh sách không
function showHoiCapNhatThang(thang, them, bo, tiepTuc) {
  var html = '<h3>Cập nhật danh sách dự án ' + esc(tenThangVN(thang)) + '?</h3><p class="sub">Timesheet đã được lưu. Hôm nay khác danh sách dự án của tháng:</p>';
  them.forEach(function (id, i) { html += '<label class="radio"><input type="checkbox" id="dtThem' + i + '" checked>Thêm vào danh sách: ' + esc((state.byId[id] || {}).TenDuAn || id) + '</label>'; });
  bo.forEach(function (id, i) { html += '<label class="radio"><input type="checkbox" id="dtBo' + i + '">Bỏ khỏi danh sách: ' + esc((state.byId[id] || {}).TenDuAn || id) + '</label>'; });
  html += '<button id="dtCapNhat">Cập nhật danh sách</button><button id="dtGiu" class="secondary">Giữ nguyên danh sách</button>';
  $("app").innerHTML = html;
  $("dtGiu").addEventListener("click", tiepTuc);
  $("dtCapNhat").addEventListener("click", function () {
    var ds = (dsThangCua(thang + "-01") || []).filter(function (id, i) { return !bo.some(function (b, j) { return b === id && $("dtBo" + j).checked; }); });
    them.forEach(function (id, i) { if ($("dtThem" + i).checked && ds.indexOf(id) < 0) ds.push(id); });
    luuDuAnThang(thang, ds, tiepTuc);
  });
}

// ---- Leader yêu cầu sửa timesheet → GM duyệt (chốt 01/11/2026, Q-91) ----
var SL_TT = { ChoDuyet: "⏳ Chờ GM duyệt", CanSuaLai: "↩️ GM yêu cầu sửa lại", DaDuyet: "✅ GM đã duyệt", TuChoi: "❌ GM từ chối",
  DaHuy: "Đã huỷ", KhongApDung: "⚠️ Không áp dụng (giờ đã thay đổi)", HetHan: "⌛ Hết hạn" };
var SL_LY_DO = ["Nhầm dự án", "Nhầm số giờ", "Khác"];
var sl = { tong: null, ngay: null, lv: [], ot: [], lyDo: "", lyDoKhac: "", ma: "" };
function slTen(pid) { return (sl.tong && sl.tong.tenDuAn && sl.tong.tenDuAn[pid]) || pid; }
function slVeLai() { if (state.days.length) showDay(); else showMessage(state.thongBao || "Hôm nay không có ngày cần điền timesheet."); }
function slDsTuMap(m) { return Object.keys(m || {}).filter(function (k) { return m[k] > 0; }).map(function (k) { return { pid: k, gio: m[k] }; }); }

function showSuaLeader() {
  showMessage("Đang tải...");
  callApi("slTong").then(function (r) {
    showVersion(r, false);
    if (!r.ok) { showMessage(r.error, "error"); return; }
    sl.tong = r; veSlDanhSach();
  }).catch(function (err) { showMessage("Lỗi kết nối: " + err, "error"); });
}

function veSlDanhSach() {
  var html = '<div class="daybar"><button id="slBack" class="nav" title="Quay lại">‹</button><h3>✏️ Yêu cầu sửa timesheet</h3><span style="width:40px"></span></div>' +
    '<p class="sub">Sửa dự án / số giờ của nhân viên trong nhóm (từ ' + esc(ngayVN(sl.tong.tuNgay)) + ' đến hôm nay). Yêu cầu gửi GM duyệt.</p>' +
    '<button id="slMoi">+ Tạo yêu cầu mới</button><h4 class="khoi">Yêu cầu của tôi</h4>';
  if (!sl.tong.yeuCau.length) html += '<p class="note">Chưa có yêu cầu nào.</p>';
  sl.tong.yeuCau.forEach(function (y, i) {
    html += '<div class="row"><div class="info"><div class="name">#' + esc(y.ma) + ' · ' + esc(y.hoTen || y.nvId) + ' · ' + esc(ngayVN(y.ngay)) + '</div>' +
      '<div class="desc">' + esc(SL_TT[y.trangThai] || y.trangThai) + (y.vong > 1 ? ' · lần ' + y.vong : '') + ' · Lý do: ' + esc(y.lyDo) + '</div>' +
      (y.lyDoGM ? '<div class="desc">GM: ' + esc(y.lyDoGM) + '</div>' : '') +
      (y.trangThai === "CanSuaLai" ? '<button class="secondary" data-sua="' + i + '">Sửa lại</button>' : '') +
      (y.trangThai === "ChoDuyet" || y.trangThai === "CanSuaLai" ? '<button class="secondary" data-huy="' + i + '">Huỷ yêu cầu</button>' : '') +
      '</div></div>';
  });
  $("app").innerHTML = html;
  $("slBack").addEventListener("click", slVeLai);
  $("slMoi").addEventListener("click", function () { veSlChon(null); });
  Array.prototype.forEach.call($("app").querySelectorAll("[data-sua]"), function (b) {
    b.addEventListener("click", function () { var y = sl.tong.yeuCau[+b.getAttribute("data-sua")]; slTaiNgay(y.nvId, y.ngay, y); });
  });
  Array.prototype.forEach.call($("app").querySelectorAll("[data-huy]"), function (b) {
    b.addEventListener("click", function () {
      var y = sl.tong.yeuCau[+b.getAttribute("data-huy")];
      b.disabled = true;
      callApi("slHuy", { ma: y.ma }).then(function (r) { if (!r.ok) { b.disabled = false; alert(r.error); return; } showSuaLeader(); });
    });
  });
}

function veSlChon(loi) {
  var html = '<div class="daybar"><button id="slBack" class="nav" title="Quay lại">‹</button><h3>Yêu cầu mới</h3><span style="width:40px"></span></div>' +
    '<h4 class="khoi">Nhân viên</h4><select id="slNv" class="search" style="width:100%;height:40px;font-size:16px">' +
    sl.tong.nhom.map(function (n) { return '<option value="' + esc(n.id) + '">' + esc(n.hoTen) + ' (' + esc(n.id) + ')</option>'; }).join("") + '</select>' +
    '<h4 class="khoi">Ngày</h4><input type="date" id="slNgay" class="search" style="width:100%;height:40px;font-size:16px" min="' + esc(sl.tong.tuNgay) + '" max="' + esc(sl.tong.denNgay) + '" value="' + esc(sl.tong.denNgay) + '">' +
    '<p class="hint" id="slLoi">' + esc(loi || "") + '</p><button id="slXem">Xem giờ hiện tại</button>';
  $("app").innerHTML = html;
  $("slBack").addEventListener("click", veSlDanhSach);
  $("slXem").addEventListener("click", function () { slTaiNgay($("slNv").value, $("slNgay").value, null); });
}

function slTaiNgay(nvId, ngay, y) {
  showMessage("Đang tải...");
  callApi("slNgay", { nhanVienId: nvId, ngay: ngay, ma: y ? y.ma : "" }).then(function (r) {
    if (!r.ok) { if (y) { veSlDanhSach(); alert(r.error); } else veSlChon(r.error); return; }
    sl.ngay = r; sl.ma = y ? y.ma : "";
    sl.lv = slDsTuMap(y ? y.banMoi.lv : r.lv); sl.ot = slDsTuMap(y ? y.banMoi.ot : r.ot);
    var ld = y ? String(y.lyDo) : "";
    sl.lyDo = SL_LY_DO.indexOf(ld) >= 0 ? ld : (ld ? "Khác" : ""); sl.lyDoKhac = ld.indexOf("Khác: ") === 0 ? ld.substring(6) : "";
    veSlForm();
  }).catch(function (err) { showMessage("Lỗi kết nối: " + err, "error"); });
}

function slTong(ds) { return ds.reduce(function (a, e) { return a + (Number(e.gio) || 0); }, 0); }
function slKhoiHtml(k, ds, can) {
  var html = "";
  ds.forEach(function (e, i) {
    html += '<div class="row"><div class="info"><div class="name">' + esc(slTen(e.pid)) + '</div><div class="desc">' + esc(e.pid) + '</div></div>' +
      '<input type="number" class="hours" data-slk="' + k + '" data-sli="' + i + '" min="0" step="0.5" inputmode="decimal" value="' + esc(e.gio) + '">' +
      '<button class="x" data-slrm="' + k + '" data-sli="' + i + '">×</button></div>';
  });
  return html + '<div class="pick"><input type="text" class="search" id="slTim' + k + '" placeholder="Thêm dự án..." autocomplete="off"><div class="results" id="slRes' + k + '" style="display:none"></div></div>' +
    '<div id="slTong' + k + '"></div>';
}
function slLyDoGui() { return sl.lyDo === "Khác" ? (sl.lyDoKhac.trim() ? "Khác: " + sl.lyDoKhac.trim() : "") : sl.lyDo; }

function veSlForm() {
  var r = sl.ngay, coOt = r.canOt > 0 || Object.keys(r.ot || {}).length > 0 || sl.ot.length > 0;
  var html = '<div class="daybar"><button id="slBack" class="nav" title="Quay lại">‹</button><h3>' + esc(r.hoTen) + ' · ' + esc(ngayVN(r.ngay)) + '</h3><span style="width:40px"></span></div>' +
    '<p class="sub">' + (r.khoa ? 'Ngày đã khoá — duyệt xong ghi điều chỉnh vào giờ chính thức.' : 'Ngày chưa khoá — duyệt xong thay bản nhân viên đang lưu.') +
    (sl.ma ? '<br>Sửa lại yêu cầu #' + esc(sl.ma) : '') + '</p>' +
    '<h4 class="khoi">Giờ hiện tại</h4><p class="note">' + (slDsTuMap(r.lv).map(function (e) { return esc(slTen(e.pid)) + ': ' + fmt(e.gio) + 'h'; }).join("<br>") || "(không có)") +
    (Object.keys(r.ot || {}).length ? '<br>OT: ' + slDsTuMap(r.ot).map(function (e) { return esc(slTen(e.pid)) + ' ' + fmt(e.gio) + 'h'; }).join(", ") : '') + '</p>' +
    '<h4 class="khoi">Giờ làm việc mới (cần ' + fmt(r.canLv) + 'h)</h4>' + slKhoiHtml("lv", sl.lv, r.canLv) +
    (coOt ? '<h4 class="khoi">Giờ OT mới (cần ' + fmt(r.canOt) + 'h)</h4>' + slKhoiHtml("ot", sl.ot, r.canOt) : '') +
    '<h4 class="khoi">Lý do</h4>' + SL_LY_DO.map(function (ld, i) {
      return '<label class="radio"><input type="radio" name="slLyDo" value="' + esc(ld) + '"' + (sl.lyDo === ld ? ' checked' : '') + '>' + esc(ld) + '</label>';
    }).join("") + '<textarea id="slLyDoKhac" maxlength="150" rows="2" placeholder="Ghi rõ lý do" style="display:' + (sl.lyDo === "Khác" ? 'block' : 'none') + '"></textarea>' +
    '<p class="hint" id="slHint"></p><button id="slXemLai" disabled>Xem lại &amp; gửi GM</button>';
  $("app").innerHTML = html;
  $("slLyDoKhac").value = sl.lyDoKhac;
  $("slBack").addEventListener("click", function () { if (sl.ma) veSlDanhSach(); else veSlChon(null); });
  Array.prototype.forEach.call($("app").querySelectorAll("[data-slk]"), function (inp) {
    inp.addEventListener("input", function () { var v = parseFloat(inp.value); sl[inp.getAttribute("data-slk")][+inp.getAttribute("data-sli")].gio = isNaN(v) ? "" : v; slKiem(); });
  });
  Array.prototype.forEach.call($("app").querySelectorAll("[data-slrm]"), function (b) {
    b.addEventListener("click", function () { sl[b.getAttribute("data-slrm")].splice(+b.getAttribute("data-sli"), 1); veSlForm(); });
  });
  ["lv", "ot"].forEach(function (k) {
    var tim = $("slTim" + k); if (!tim) return;
    tim.addEventListener("input", function () {
      var tokens = norm(tim.value).split(/\s+/).filter(Boolean), box = $("slRes" + k);
      if (!tokens.length) { box.style.display = "none"; return; }
      var co = sl[k].map(function (e) { return e.pid; });
      var ds = timDuAn(sl.tong.duAn || [], tokens, co).slice(0, MAX_RESULTS);
      box.innerHTML = ds.length ? ds.map(function (p) { return ketQuaDuAnHtml(p, tokens); }).join("")
        : '<div class="res-note">Không tìm thấy dự án phù hợp.</div>';
      box.style.display = "block";
    });
    $("slRes" + k).addEventListener("click", function (e) {
      var it = e.target.closest(".res-item"); if (!it) return;
      sl[k].push({ pid: it.getAttribute("data-id"), gio: "" }); veSlForm();
    });
  });
  Array.prototype.forEach.call($("app").querySelectorAll('input[name="slLyDo"]'), function (rd) {
    rd.addEventListener("change", function () { sl.lyDo = rd.value; $("slLyDoKhac").style.display = sl.lyDo === "Khác" ? "block" : "none"; slKiem(); });
  });
  $("slLyDoKhac").addEventListener("input", function (e) { sl.lyDoKhac = e.target.value; slKiem(); });
  $("slXemLai").addEventListener("click", veSlXemLai);
  slKiem();
}

function slKiem() {
  var r = sl.ngay, loi = "";
  [["lv", r.canLv, "Giờ làm việc"], ["ot", r.canOt, "Giờ OT"]].forEach(function (x) {
    var ds = sl[x[0]], t = slTong(ds), el = $("slTong" + x[0]);
    if (el) el.innerHTML = '<span>Tổng</span><span class="' + (Math.abs(t - x[1]) < 1e-9 ? "ok" : "error") + '">' + fmt(t) + 'h / ' + fmt(x[1]) + 'h</span>';
    if (el) el.style.cssText = "display:flex;justify-content:space-between;padding:10px 0 4px;font-weight:600";
    if (loi) return;
    if (ds.some(function (e) { return !(e.gio > 0); })) loi = x[2] + ": có dự án chưa nhập giờ.";
    else if (ds.some(function (e) { return !laBoiSo(e.gio); })) loi = x[2] + ": số giờ phải là bội số của 0,5.";
    else if (Math.abs(t - x[1]) > 1e-9) loi = x[2] + ": tổng phải đúng " + fmt(x[1]) + "h.";
  });
  if (!loi && !slLyDoGui()) loi = sl.lyDo === "Khác" ? "Vui lòng ghi rõ lý do." : "Vui lòng chọn lý do.";
  $("slHint").textContent = loi;
  $("slXemLai").disabled = !!loi;
}

function slTruocSau(cu, moi) {
  var ks = {}; Object.keys(cu || {}).forEach(function (k) { ks[k] = 1; }); moi.forEach(function (e) { ks[e.pid] = 1; });
  var m = {}; moi.forEach(function (e) { m[e.pid] = e.gio; });
  return Object.keys(ks).map(function (k) {
    return '<div class="row"><div class="info"><div class="name">' + esc(slTen(k)) + '</div></div><div class="name">' + fmt(cu[k] || 0) + 'h → ' + fmt(m[k] || 0) + 'h</div></div>';
  }).join("");
}

function veSlXemLai() {
  var r = sl.ngay, coOt = sl.ot.length || Object.keys(r.ot || {}).length;
  $("app").innerHTML = '<h3>Xem lại yêu cầu</h3><p class="sub">' + esc(r.hoTen) + ' · ' + esc(ngayVN(r.ngay)) + '</p>' +
    '<h4 class="khoi">Giờ làm việc (hiện tại → mới)</h4>' + slTruocSau(r.lv, sl.lv) +
    (coOt ? '<h4 class="khoi">Giờ OT (hiện tại → mới)</h4>' + slTruocSau(r.ot, sl.ot) : '') +
    '<h4 class="khoi">Lý do</h4><p class="note">' + esc(slLyDoGui()) + '</p>' +
    '<button id="slGui">✅ Gửi GM duyệt</button><button id="slSua" class="secondary">✏️ Sửa lại</button><p class="hint" id="slLoiGui"></p>';
  $("slSua").addEventListener("click", veSlForm);
  $("slGui").addEventListener("click", function () {
    $("slGui").disabled = true;
    var doi = function (ds) { return ds.map(function (e) { return { projectId: e.pid, soGio: e.gio }; }); };
    callApi("slGui", { nhanVienId: r.nhanVienId, ngay: r.ngay, lv: doi(sl.lv), ot: doi(sl.ot), lyDo: slLyDoGui(), ma: sl.ma }).then(function (k) {
      if (!k.ok) { $("slGui").disabled = false; $("slLoiGui").textContent = k.error || "Không gửi được."; return; }
      $("app").innerHTML = '<p class="msg ok">' + (k.tuDuyet ? "Đã cập nhật timesheet (bạn là GM nên yêu cầu được duyệt ngay)." : "Đã gửi GM duyệt yêu cầu #" + esc(k.ma) + ".") + '</p>' +
        (k.canhBao ? '<p class="note warn">' + esc(k.canhBao) + '</p>' : '') + '<button id="slVeDs" class="secondary">Về danh sách yêu cầu</button>';
      $("slVeDs").addEventListener("click", showSuaLeader);
    }).catch(function (err) { $("slGui").disabled = false; $("slLoiGui").textContent = "Lỗi kết nối: " + err; });
  });
}

function ngayTuDuongDan() {
  try { var v = new URLSearchParams(window.location.search).get("ngay"); return /^\d{4}-\d{2}-\d{2}$/.test(v || "") ? v : ""; } catch (e) { return ""; }
}
state.focus = "";

function newRow() { return { projectId: "", gio: "" }; }
function $(id) { return document.getElementById(id); }
function cur() { return state.days[state.di]; } // ngày đang xem
// Giờ khả dụng của ngày đang xem (máy chủ tính theo đơn nghỉ/muộn/sớm đã duyệt); thiếu thì dùng giá trị chung
// Khối giờ: "" = giờ làm việc, "o" = giờ OT (2 khối riêng, mỗi khối có tổng riêng phải khớp)
function rowsOf(kh) { return kh === "o" ? state.otRows : state.rows; }
function coLamViec(d) { return !(d && typeof d.available === "number" && d.available <= 0); }   // ngày có giờ làm việc để điền
function coOt(d) { return !!(d && typeof d.otGio === "number" && d.otGio > 0); }                   // ngày có giờ OT để điền
function gioKhoi(kh) { return kh === "o" ? cur().otGio : gioKhaDung(); }
function tongRows(list) { return (list || []).reduce(function (a, e) { return a + e.soGio; }, 0); }
function gioKhaDung() { var d = cur(); return d && typeof d.available === "number" ? d.available : state.available; }

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

// Bỏ dấu tiếng Việt + về chữ thường để tìm "ban ruoi" ra "Bắn ruồi"
function norm(s) {
  return String(s || "").toLowerCase().replace(/đ/g, "d").normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

function fmt(n) { return String(Math.round(n * 100) / 100); }
function laBoiSo(v) { var k = v / BUOC_GIO; return Math.abs(k - Math.round(k)) < 1e-9; }

function callApi(action, extra) {
  var payload = Object.assign({ action: action, initData: tg ? tg.initData : "" }, extra || {});
  return fetch(API_URL, { method: "POST", body: JSON.stringify(payload) }).then(function (r) { return r.json(); });
}

function showVersion(data, loi) {
  var el = $("ver");
  if (!el) return;
  var may = loi ? "không kết nối được"
    : data && data.version ? data.version
    : data && data.ok ? "bản cũ — chưa cập nhật" : "không rõ";
  var ms = (data && typeof data.ms === "number") ? " · xử lý " + data.ms + "ms" : ""; // thời gian máy chủ xử lý lần gọi gần nhất
  el.textContent = "Giao diện " + CLIENT_VERSION + (data || loi ? " · Máy chủ " + may : "") + ms;
}

function init() {
  showVersion(null, false);
  callApi("init").then(function (data) {
    showVersion(data, false);
    if (!data.ok) { showMessage(data.error, "error"); return; }
    state.hoTen = data.hoTen;
    state.available = data.available;
    state.projects = data.projects;
    state.byId = {};
    data.projects.forEach(function (p) { state.byId[p.ProjectID] = p; });
    state.daGop = data.daGop || [];
    state.thongBao = data.thongBao || "";
    state.days = data.days || [];
    state.dat = data.duAnThang || null; // danh sách dự án của tôi theo tháng (13_DuAnThang.gs)
    state.laLeader = !!data.laLeader;
    if (state.projects.length) { $("dmWrap").style.display = "block"; $("dmBtn").onclick = showDanhMuc; }
    if (state.dat && state.projects.length) {
      $("dmThangBtn").style.display = "block";
      $("dmThangBtn").onclick = function () { showChonDuAnThang(state.dat.thang, (state.dat.ds[state.dat.thang] || []).slice(), true, veLaiSauChon); };
    }
    if (data.laLeader) { // Leader: yêu cầu sửa timesheet của nhân viên trong nhóm (Q-91)
      $("dmWrap").style.display = "block"; $("dmBtn").style.display = state.projects.length ? "" : "none";
      $("slBtn").style.display = "block"; $("slBtn").onclick = showSuaLeader;
      if (xemTuDuongDan() === "sualeader") { showSuaLeader(); return; }
    }
    if (xemTuDuongDan() === "duan" && state.projects.length) { showDanhMuc(); return; } // mở từ lệnh /duan
    if (state.days.length === 0) {
      if (data.thongBao) { showMessage(data.thongBao); return; } // không phải lỗi: hôm nay không cần điền (cuối tuần, lễ, nghỉ cả ngày)
      showMessage(data.version ? "Không xác định được ngày để điền timesheet."
        : "Máy chủ chưa được cập nhật lên phiên bản mới (thiếu thông tin ngày). Vui lòng báo C&B/IT cập nhật rồi mở lại.", "error");
      return;
    }
    state.di = state.days.length - 1; // mở lên ở "hôm nay" (ngày mới nhất)
    var ngayMo = ngayTuDuongDan();
    for (var i = 0; ngayMo && i < state.days.length; i++) {
      if (state.days[i].ngay === ngayMo) { state.di = i; state.focus = ngayMo; break; } // ngày không còn trong danh sách (đã khoá): mở như bình thường
    }
    // Lần đầu mở trong tháng: chọn danh sách dự án của tháng (gợi ý sẵn danh sách tháng trước)
    if (state.dat && !state.dat.daChon && state.projects.length) { showChonDuAnThang(state.dat.thang, (state.dat.goiY || []).slice(), false, showDay); return; }
    showDay();
  }).catch(function (err) { showVersion(null, true); showMessage("Lỗi kết nối: " + err, "error"); });
}

function showMessage(text, cls) {
  var root = $("app");
  root.innerHTML = "";
  var p = document.createElement("p");
  p.className = "msg " + (cls || "");
  p.textContent = text; // textContent: không bao giờ diễn giải HTML trong thông báo lỗi
  root.appendChild(p);
}

// ---- Màn hình 1: chọn dự án + nhập giờ ----

function chosenIds(kh) {
  return rowsOf(kh).map(function (r) { return r.projectId; }).filter(Boolean);
}

function pickRowHtml(i, kh) {
  var rm = rowsOf(kh).length > 1 ? '<button class="x" data-rm="' + i + '" data-k="' + kh + '" title="Xoá dòng">×</button>' : "";
  return '<div class="pick">' +
    '<div class="pickhead"><label>Chọn dự án</label>' + rm + '</div>' +
    '<input type="text" class="search" data-i="' + i + '" data-k="' + kh + '" placeholder="Gõ để tìm dự án..." autocomplete="off">' +
    '<div class="results" id="res' + kh + i + '" style="display:none"></div>' +
    '</div>';
}

function chosenRowHtml(r, i, kh) {
  var p = state.byId[r.projectId];
  return '<div class="row">' +
    '<div class="info"><div class="name">' + esc(p.TenDuAn) + '</div>' + chiTietDuAnHtml(p) + '</div>' +
    '<input type="number" class="hours" data-i="' + i + '" data-k="' + kh + '" min="0" step="0.5" inputmode="decimal" placeholder="0" value="' + esc(r.gio) + '">' +
    '<button class="x" data-rm="' + i + '" data-k="' + kh + '" title="Bỏ dự án này">×</button>' +
    '</div>';
}

// HTML của 1 khối (danh sách dòng + đếm + nút thêm + tổng + gợi ý). Khối làm việc giữ nguyên id cũ; khối OT thêm hậu tố O.
function khoiHtml(kh) {
  var s = kh === "o" ? "O" : "";
  var html = "";
  rowsOf(kh).forEach(function (r, i) { html += r.projectId ? chosenRowHtml(r, i, kh) : pickRowHtml(i, kh); });
  html += '<p class="count" id="count' + s + '"></p>';
  html += '<button id="addBtn' + s + '" class="secondary">+ Thêm dự án khác</button>';
  html += '<div id="total' + s + '"></div><p class="hint" id="hint' + s + '"></p>';
  return html;
}

function render() {
  var root = $("app");
  if (state.projects.length === 0) {
    showMessage("Chưa có dự án nào Active."); return;
  }
  var d = cur();
  var lv = coLamViec(d), ot = coOt(d);
  var html = dayBarHtml();
  var gioTxt = (lv ? 'Giờ khả dụng: ' + fmt(gioKhaDung()) + 'h' : 'Ngày nghỉ') + (ot ? ' · Giờ OT: ' + fmt(d.otGio) + 'h' : '');
  var bs = !!d.boSung; // ngày đã khoá nhưng được mở cho ĐIỀN BỔ SUNG (1 lần) - cần ghi lý do ngắn
  var dc = !!d.dieuChinh; // ngày đã khoá có giờ lệch: ĐIỀU CHỈNH HỒI TỐ (1 lần) - nhập lại cả ngày + chọn lý do
  var hanNhan = bs ? 'Hạn điền bổ sung: ' : dc ? 'Hạn điều chỉnh: ' : 'Hạn điền/sửa: ';
  if (state.editing) {
    html += '<p class="sub">' + esc(state.hoTen) + ' · Đang thay đổi timesheet — bản đã lưu' +
      (d.saved && d.saved.savedAt ? ' lúc ' + esc(d.saved.savedAt) : '') +
      ' sẽ được thay bằng nội dung bạn xác nhận lưu<br>' + gioTxt + (d.lyDo ? ' (' + esc(d.lyDo) + ')' : '') +
      '<br>' + hanNhan + esc(d.han) + '</p>';
  } else {
    html += '<p class="sub">' + esc(state.hoTen) + (dc ? ' · Điều chỉnh hồi tố · ' : ' · Chưa điền · ') + gioTxt +
      (d.lyDo ? '<br>' + esc(d.lyDo) : '') + '<br>' + hanNhan + esc(d.han) + '</p>';
  }
  if (bs) html += '<p class="note warn">' + esc(d.canhBao || 'Ngày này đã bị ghi 0h vì chưa điền. Bạn được điền bổ sung đúng 1 lần.') + '</p>';
  if (dc) {
    html += '<p class="note warn">' + esc(d.canhBao || 'Giờ đã chốt của ngày này khác giờ cần điền. Bạn được điều chỉnh đúng 1 lần.') + '</p>';
    if (!lv && !ot) html += '<p class="note">Ngày này không còn giờ cần điền: khi lưu, toàn bộ giờ đã chốt của ngày sẽ được trừ về 0h.</p>';
  }
  if (lv && ot) html += '<h4 class="khoi">Giờ làm việc</h4>';
  if (lv) html += khoiHtml("");
  if (ot) html += '<h4 class="khoi">Giờ OT</h4>' + khoiHtml("o");
  if (bs) {
    html += '<h4 class="khoi">Lý do chưa điền đúng hạn</h4>' +
      '<textarea id="lyDo" maxlength="200" rows="3" placeholder="Ghi ngắn gọn lý do (VD: ốm, họp khách hàng cả ngày...)"></textarea>' +
      '<p class="hint" id="hintLyDo"></p>';
  }
  if (dc) {
    html += '<h4 class="khoi">Lý do điều chỉnh</h4>';
    (d.lyDoChon || LY_DO_DC_MAC_DINH).forEach(function (ld, i) {
      html += '<label class="radio"><input type="radio" name="lyDoDc" id="lyDoDc' + i + '" value="' + esc(ld) + '"' + (state.lyDoDc === ld ? ' checked' : '') + '>' + esc(ld) + '</label>';
    });
    html += '<textarea id="lyDoKhac" maxlength="150" rows="2" placeholder="Ghi rõ lý do" style="display:' + (state.lyDoDc === "Khác" ? 'block' : 'none') + '"></textarea>' +
      '<p class="hint" id="hintLyDo"></p>';
  }
  html += '<button id="reviewBtn" disabled>Xem lại &amp; lưu</button>';
  if (state.editing) html += '<button id="cancelEditBtn" class="secondary">Huỷ thay đổi, giữ bản đã lưu</button>';
  root.innerHTML = html;
  bindDayBar();

  Array.prototype.forEach.call(root.querySelectorAll(".search"), bindSearch);
  Array.prototype.forEach.call(root.querySelectorAll(".hours"), function (inp) {
    inp.addEventListener("input", onHoursInput);
  });
  Array.prototype.forEach.call(root.querySelectorAll("[data-rm]"), function (btn) {
    btn.addEventListener("click", function () { onRemoveRow(parseInt(btn.getAttribute("data-rm"), 10), btn.getAttribute("data-k") || ""); });
  });
  if (lv) $("addBtn").addEventListener("click", function () { onAddRow(""); });
  if (ot) $("addBtnO").addEventListener("click", function () { onAddRow("o"); });
  $("reviewBtn").addEventListener("click", showConfirm);
  if (state.editing) $("cancelEditBtn").addEventListener("click", onCancelEdit);
  if (bs) { // giá trị đặt bằng .value (không chèn vào HTML) nên mọi ký tự đều hiển thị như chữ
    $("lyDo").value = state.lyDoBoSung;
    $("lyDo").addEventListener("input", function (e) { state.lyDoBoSung = e.target.value; updateTotal(); });
  }
  if (dc) {
    $("lyDoKhac").value = state.lyDoDcKhac; // đặt bằng .value: mọi ký tự hiển thị như chữ
    Array.prototype.forEach.call(root.querySelectorAll('input[name="lyDoDc"]'), function (r) {
      r.addEventListener("change", function () {
        state.lyDoDc = r.value;
        $("lyDoKhac").style.display = state.lyDoDc === "Khác" ? "block" : "none";
        updateTotal();
      });
    });
    $("lyDoKhac").addEventListener("input", function (e) { state.lyDoDcKhac = e.target.value; updateTotal(); });
  }
  updateTotal();
}

// Lý do điều chỉnh gửi lên máy chủ: lựa chọn có sẵn, hoặc "Khác: <ghi rõ>"; "" nếu chưa hợp lệ
function lyDoDcGuiDi() {
  if (!state.lyDoDc) return "";
  if (state.lyDoDc !== "Khác") return state.lyDoDc;
  var t = String(state.lyDoDcKhac || "").trim();
  return t ? "Khác: " + t : "";
}

function bindSearch(inp) {
  var i = parseInt(inp.getAttribute("data-i"), 10);
  var kh = inp.getAttribute("data-k") || "";
  var box = $("res" + kh + i);
  inp.addEventListener("focus", function () { showResults(i, inp.value, kh); });
  inp.addEventListener("input", function () { showResults(i, inp.value, kh); });
  inp.addEventListener("blur", function () { setTimeout(function () { box.style.display = "none"; }, 200); });
  box.addEventListener("click", function (e) {
    var item = e.target.closest(".res-item");
    if (item) pickProject(i, item.getAttribute("data-id"), kh);
  });
}

function showResults(i, query, kh) {
  var box = $("res" + kh + i);
  if (!box) return;
  var tokens = norm(query).split(/\s+/).filter(Boolean);
  var chosen = chosenIds(kh);
  var matches = timDuAn(state.projects, tokens, chosen); // ưu tiên tên, rồi mô tả, rồi mã

  var html = "";
  matches.slice(0, MAX_RESULTS).forEach(function (p) { html += ketQuaDuAnHtml(p, tokens); });
  if (matches.length === 0) {
    html = '<div class="res-note">Không tìm thấy dự án phù hợp.</div>';
  } else if (matches.length > MAX_RESULTS) {
    html += '<div class="res-note">Còn ' + (matches.length - MAX_RESULTS) + ' dự án khác — gõ thêm để lọc.</div>';
  }
  box.innerHTML = html;
  box.style.display = "block";
}

function pickProject(i, projectId, kh) {
  rowsOf(kh)[i].projectId = projectId;
  render();
  var hours = document.querySelector('.hours[data-i="' + i + '"][data-k="' + kh + '"]');
  if (hours) hours.focus();
}

function onAddRow(kh) {
  // Đang có sẵn 1 dòng chưa chọn dự án thì không thêm dòng trống thứ 2, chỉ đưa con trỏ vào dòng đó
  var rows = rowsOf(kh);
  var emptyIndex = -1;
  rows.forEach(function (r, i) { if (!r.projectId && emptyIndex === -1) emptyIndex = i; });
  if (emptyIndex === -1) {
    rows.push(newRow());
    emptyIndex = rows.length - 1;
    render();
  }
  var inp = document.querySelector('.search[data-i="' + emptyIndex + '"][data-k="' + kh + '"]');
  if (inp) inp.focus();
}

function onRemoveRow(i, kh) {
  if (rowsOf(kh).length === 1) { if (kh === "o") state.otRows = [newRow()]; else state.rows = [newRow()]; }
  else { rowsOf(kh).splice(i, 1); }
  render();
}

function onHoursInput(e) {
  var i = parseInt(e.target.getAttribute("data-i"), 10);
  var kh = e.target.getAttribute("data-k") || "";
  var v = parseFloat(e.target.value);
  rowsOf(kh)[i].gio = isNaN(v) ? "" : v;
  updateTotal();
}

// Cập nhật đếm/tổng/gợi ý của 1 khối; trả true nếu khối đã khớp đúng giờ yêu cầu
function capNhatKhoi(kh, kd) {
  var s = kh === "o" ? "O" : "";
  var total = 0, count = 0, incomplete = false, saiBuoc = false;
  rowsOf(kh).forEach(function (r) {
    if (!r.projectId) return;
    count++;
    if (r.gio > 0) { total += r.gio; if (!laBoiSo(r.gio)) saiBuoc = true; } else { incomplete = true; }
  });
  var ok = count > 0 && !incomplete && !saiBuoc && Math.abs(total - kd) < 1e-9;

  $("count" + s).textContent = "Đã chọn: " + count + " dự án";
  $("total" + s).innerHTML = '<span>Tổng</span><span class="' + (ok ? "ok" : "error") + '">' + fmt(total) + 'h / ' + kd + 'h</span>';

  var hint = "";
  var tenKhoi = kh === "o" ? "giờ OT" : "giờ khả dụng";
  if (incomplete) { hint = "Có dự án đã chọn nhưng chưa nhập giờ."; }
  else if (saiBuoc) { hint = "Số giờ phải là bội số của 0,5 (VD 0,5; 1; 1,5)."; }
  else if (total > kd + 1e-9) { hint = "Tổng giờ vượt quá " + tenKhoi + " " + fmt(total - kd) + "h."; }
  else if (count > 0 && total < kd) { hint = "Còn thiếu " + fmt(kd - total) + "h."; }
  $("hint" + s).textContent = hint;
  return ok;
}

function updateTotal() {
  var d = cur();
  var ok = true;
  if (coLamViec(d)) ok = capNhatKhoi("", gioKhaDung()) && ok;
  if (coOt(d)) ok = capNhatKhoi("o", d.otGio) && ok;
  if (d.boSung) { // ngày Bổ sung bắt buộc ghi lý do ngắn
    var coLyDo = String(state.lyDoBoSung || "").trim().length > 0;
    $("hintLyDo").textContent = coLyDo ? "" : "Vui lòng ghi lý do ngắn vì sao chưa điền đúng hạn.";
    ok = ok && coLyDo;
  }
  if (d.dieuChinh) { // ngày Điều chỉnh bắt buộc chọn lý do (Khác thì phải ghi rõ)
    var ld = lyDoDcGuiDi();
    $("hintLyDo").textContent = ld ? "" : (state.lyDoDc === "Khác" ? "Vui lòng ghi rõ lý do." : "Vui lòng chọn lý do điều chỉnh.");
    ok = ok && !!ld;
  }
  $("reviewBtn").disabled = !ok;
}

// ---- Màn hình 2: xem lại & xác nhận ----

function buildEntries(kh) {
  return rowsOf(kh || "")
    .filter(function (r) { return r.projectId && r.gio > 0; })
    .map(function (r) { return { projectId: r.projectId, soGio: r.gio }; });
}

function khoiXacNhanHtml(kh, gio) {
  var html = "", total = 0;
  buildEntries(kh).forEach(function (e) {
    var p = state.byId[e.projectId];
    total += e.soGio;
    html += '<div class="row"><div class="info"><div class="name">' + esc(p.TenDuAn) + '</div>' +
      '<div class="desc">' + esc(p.MoTa || "(Chưa có mô tả)") + '</div></div>' +
      '<div class="name">' + fmt(e.soGio) + 'h</div></div>';
  });
  return html + '<div id="total' + (kh === "o" ? "O" : "") + '"><span>Tổng</span><span class="ok">' + fmt(total) + 'h / ' + fmt(gio) + 'h</span></div>';
}

// Màn xem lại của ngày Điều chỉnh: từng dự án "giờ đã chốt → giờ mới"
function khoiTruocSauHtml(kh, gio) {
  var d = cur();
  var cu = {}, thuTu = [];
  ((kh === "o" ? d.hienTai.otEntries : d.hienTai.entries) || []).forEach(function (e) {
    cu[e.projectId] = e.soGio; thuTu.push(e.projectId);
    if (!state.byId[e.projectId]) state.byId[e.projectId] = { ProjectID: e.projectId, TenDuAn: e.ten, MoTa: e.moTa };
  });
  var moi = {};
  buildEntries(kh).forEach(function (e) { moi[e.projectId] = e.soGio; if (thuTu.indexOf(e.projectId) < 0) thuTu.push(e.projectId); });
  var html = "", tCu = 0, tMoi = 0;
  thuTu.forEach(function (pid) {
    var p = state.byId[pid] || { TenDuAn: pid };
    var a = cu[pid] || 0, b = moi[pid] || 0;
    tCu += a; tMoi += b;
    html += '<div class="row"><div class="info"><div class="name">' + esc(p.TenDuAn) + '</div></div>' +
      '<div class="name">' + fmt(a) + 'h → ' + fmt(b) + 'h</div></div>';
  });
  return html + '<div id="total' + (kh === "o" ? "O" : "") + '"><span>Tổng</span><span class="ok">' + fmt(tCu) + 'h → ' + fmt(tMoi) + 'h / ' + fmt(gio) + 'h</span></div>';
}

function showConfirm() {
  var root = $("app");
  var d = cur();
  var lv = coLamViec(d), ot = coOt(d);
  var html = '<h3>Xem lại trước khi lưu</h3><p class="sub">' + esc(state.hoTen) + ' · ' + esc(d.nhan) + ' ' + esc(d.ddmm) + ' · ' + esc(d.thu) + '</p>';
  if (state.editing) {
    html += '<p class="note warn">Bản đã lưu' + (d.saved && d.saved.savedAt ? ' lúc ' + esc(d.saved.savedAt) : '') +
      ' sẽ bị xoá và thay bằng nội dung dưới đây.</p>';
  }
  if (d.dieuChinh) {
    var coOtCu = (d.hienTai.otEntries || []).length > 0;
    html += '<h4 class="khoi">Giờ làm việc (đã chốt → mới)</h4>' + khoiTruocSauHtml("", gioKhaDung());
    if (ot || coOtCu) html += '<h4 class="khoi">Giờ OT (đã chốt → mới)</h4>' + khoiTruocSauHtml("o", ot ? d.otGio : 0);
    html += '<h4 class="khoi">Lý do</h4><p class="note">' + esc(lyDoDcGuiDi()) + '</p>' +
      '<p class="note warn">Chỉ được điều chỉnh 1 lần: sau khi lưu bạn không sửa lại được.</p>';
  } else {
    if (lv && ot) html += '<h4 class="khoi">Giờ làm việc</h4>';
    if (lv) html += khoiXacNhanHtml("", gioKhaDung());
    if (ot) html += '<h4 class="khoi">Giờ OT</h4>' + khoiXacNhanHtml("o", d.otGio);
  }
  if (d.boSung) {
    html += '<h4 class="khoi">Lý do</h4><p class="note">' + esc(String(state.lyDoBoSung || "").trim()) + '</p>' +
      '<p class="note warn">Chỉ được điền bổ sung 1 lần: sau khi lưu bạn không sửa lại được.</p>';
  }
  html += '<button id="confirmBtn">✅ Xác nhận, lưu</button>';
  html += '<button id="backBtn" class="secondary">✏️ Sửa lại</button>';
  root.innerHTML = html;
  $("confirmBtn").addEventListener("click", onConfirm);
  $("backBtn").addEventListener("click", render);
}

var submitting = false;

function onConfirm() {
  if (submitting) return; // chặn bấm đôi ngay trên máy; server cũng tự chặn ghi trùng
  submitting = true;
  $("confirmBtn").disabled = true;
  $("backBtn").disabled = true;
  var d = cur();
  var duLieu = { entries: buildEntries(""), otEntries: buildEntries("o"), ngay: d.ngay };
  if (d.boSung) duLieu.lyDo = String(state.lyDoBoSung || "").trim();
  if (d.dieuChinh) duLieu.lyDo = lyDoDcGuiDi();
  callApi("submit", duLieu).then(function (res) {
    submitting = false;
    showVersion(res, false);
    if (res.status === "locked") { showLocked(res.error); return; }
    if (!res.ok) { showErrorWithBack(res.error); return; }

    d.saved = { savedAt: res.savedAt, entries: res.entries, otEntries: res.otEntries || [] };
    delete state.drafts[d.ngay];
    state.editing = false;
    state.rows = [newRow()];
    state.otRows = [newRow()];
    state.lyDoBoSung = "";
    state.lyDoDc = ""; state.lyDoDcKhac = "";
    var ngayLabel = d.nhan.toLowerCase();
    var hienKetQua = function () {
      if (state.focus) { showConLai(res); return; } // mở từ tin nhắc 1 ngày: báo các ngày còn cần điền
      if (res.status === "already_saved") {
        showSaved("Timesheet " + ngayLabel + " đã được ghi nhận",
          "Nội dung không thay đổi so với bản đã lưu nên không ghi thêm.", false);
      } else if (res.status === "updated") {
        showSaved("Đã cập nhật timesheet " + ngayLabel,
          "Bản đã lưu" + (res.previousSavedAt ? " lúc " + res.previousSavedAt : "") +
          " đã bị xoá và thay bằng bản mới này.", true);
      } else {
        showSuccess(res.savedAt);
      }
    };
    // Danh sách dự án của tháng: khác giờ làm việc vừa lưu thì hỏi có thêm vào / bỏ khỏi danh sách không (OT không tính)
    var dsT = d.dieuChinh ? null : dsThangCua(d.ngay);
    if (dsT && res.status !== "already_saved") {
      var daLuuIds = duLieu.entries.map(function (e) { return e.projectId; });
      var them = daLuuIds.filter(function (id) { return dsT.indexOf(id) < 0 && state.byId[id]; });
      var bo = dsT.filter(function (id) { return daLuuIds.indexOf(id) < 0 && state.byId[id]; });
      if (them.length || bo.length) { showHoiCapNhatThang(d.ngay.substring(0, 7), them, bo, hienKetQua); return; }
    }
    hienKetQua();
  }).catch(function (err) { submitting = false; showErrorWithBack("Lỗi kết nối: " + err); });
}

// Các ngày còn cần điền/xử lý (chưa có bản lưu, không phải ngày chỉ để xem), sắp từ cũ đến mới
function ngayConCanDien() {
  return state.days.filter(function (x) { return !x.readonly && !x.saved; })
    .sort(function (a, b) { return a.ngay < b.ngay ? -1 : 1; });
}

// Sau khi lưu (mở từ tin nhắc 1 ngày): báo đã lưu + các ngày còn cần điền, nút "Điền tiếp <ngày>" và "Đóng"
function showConLai(res) {
  var d = cur();
  var con = ngayConCanDien();
  var tieuDe = res.status === "already_saved" ? "Timesheet " + d.thu + " " + d.ddmm + " đã được ghi nhận"
    : res.status === "updated" ? "✅ Đã cập nhật timesheet " + d.thu + " " + d.ddmm : "✅ Đã lưu timesheet " + d.thu + " " + d.ddmm;
  var html = '<p class="savedtitle">' + esc(tieuDe) + '</p>' +
    (res.savedAt ? '<p class="sub">Ghi nhận lúc ' + esc(res.savedAt) + '</p>' : '');
  if (con.length === 0) {
    html += '<p class="note ok">Bạn đã điền đủ tất cả các ngày.</p><button id="closeBtn" class="secondary">Đóng</button>';
    $("app").innerHTML = html;
    $("closeBtn").addEventListener("click", function () { tg.close(); });
    setTimeout(function () { tg.close(); }, 2500);
    return;
  }
  html += '<p class="note">Bạn còn ' + con.length + ' ngày cần điền:</p><p class="note">' + con.map(function (x) {
    return '• ' + esc(x.thu) + ' ' + esc(x.ddmm) + (x.boSung || x.dieuChinh ? ' (' + esc(x.nhan) + ')' : '') + ' — hạn ' + esc(x.han);
  }).join('<br>') + '</p>';
  html += '<button id="nextBtn">Điền tiếp ' + esc(con[0].thu) + ' ' + esc(con[0].ddmm) + '</button><button id="closeBtn" class="secondary">Đóng</button>';
  $("app").innerHTML = html;
  $("nextBtn").addEventListener("click", function () {
    var k = state.days.indexOf(con[0]);
    state.di = k; state.focus = con[0].ngay;
    showDay();
  });
  $("closeBtn").addEventListener("click", function () { tg.close(); });
}

function showSuccess(savedAt) {
  var d = cur();
  var root = $("app");
  root.innerHTML = "";
  var p = document.createElement("p");
  p.className = "msg ok";
  p.textContent = "Đã lưu thành công!";
  root.appendChild(p);
  if (savedAt) {
    var t = document.createElement("p");
    t.className = "sub";
    t.style.textAlign = "center";
    t.textContent = "Timesheet " + d.nhan.toLowerCase() + " " + d.ddmm + " · Ghi nhận lúc " + savedAt;
    root.appendChild(t);
  }
  setTimeout(function () { tg.close(); }, 1800);
}

// Ngày đã khoá / chưa tới: không còn gì để sửa, chỉ cho đóng
function showLocked(text) {
  showMessage(text, "error");
  var btn = document.createElement("button");
  btn.id = "closeBtn2";
  btn.textContent = "Đóng";
  btn.addEventListener("click", function () { tg.close(); });
  $("app").appendChild(btn);
}

// ---- Chọn ngày (hôm qua / hôm nay) ----

function dayBarHtml() {
  var d = cur();
  var title = esc(d.nhan) + ' · ' + esc(d.ddmm) + ' · ' + esc(d.thu);
  if (state.days.length <= 1 || state.focus) return '<div class="daybar"><h3>' + title + '</h3></div>'; // mở từ tin nhắc: chỉ ngày đó
  return '<div class="daybar">' +
    '<button id="prevDay" class="nav"' + (state.di > 0 ? '' : ' disabled') + ' title="Ngày trước">‹</button>' +
    '<h3>' + title + '</h3>' +
    '<button id="nextDay" class="nav"' + (state.di < state.days.length - 1 ? '' : ' disabled') + ' title="Ngày sau">›</button>' +
    '</div>';
}

function bindDayBar() {
  if (!$("prevDay")) return;
  $("prevDay").addEventListener("click", function () { goDay(-1); });
  $("nextDay").addEventListener("click", function () { goDay(1); });
}

// Chuyển ngày: giữ lại phần đang nhập dở của ngày cũ để quay lại không mất
function goDay(delta) {
  var ni = state.di + delta;
  if (ni < 0 || ni >= state.days.length) return;
  state.drafts[cur().ngay] = { rows: state.rows, otRows: state.otRows, editing: state.editing, lyDoBoSung: state.lyDoBoSung, lyDoDc: state.lyDoDc, lyDoDcKhac: state.lyDoDcKhac };
  state.di = ni;
  showDay();
}

// Vào 1 ngày: có nháp thì khôi phục; đã có bản lưu và không đang sửa thì hiện màn "đã ghi nhận"; còn lại hiện form
function showDay() {
  var d = cur();
  var dr = state.drafts[d.ngay];
  if (dr) { state.rows = dr.rows; state.otRows = dr.otRows || [newRow()]; state.editing = dr.editing; state.lyDoBoSung = dr.lyDoBoSung || ""; state.lyDoDc = dr.lyDoDc || ""; state.lyDoDcKhac = dr.lyDoDcKhac || ""; }
  else {
    state.rows = [newRow()]; state.otRows = [newRow()]; state.editing = false; state.lyDoBoSung = ""; state.lyDoDc = ""; state.lyDoDcKhac = "";
    var dsT = dsThangCua(d.ngay); // hiện sẵn dự án của tháng ở khối giờ làm việc (giờ để trống)
    if (dsT && !d.saved && !d.readonly && !d.dieuChinh && coLamViec(d)) {
      var cacDong = dsT.filter(function (id) { return state.byId[id]; }).map(function (id) { return { projectId: id, gio: "" }; });
      if (cacDong.length) state.rows = cacDong;
    }
    if (d.dieuChinh && d.hienTai) { // ngày Điều chỉnh: điền sẵn giờ đã chốt hiện tại để nhân viên chỉ cần sửa
      state.rows = doiSangRows(d.hienTai.entries);
      state.otRows = doiSangRows(d.hienTai.otEntries);
      if (!coLamViec(d) || state.rows.length === 0) state.rows = [newRow()];
      if (!coOt(d) || state.otRows.length === 0) state.otRows = [newRow()];
    }
  }
  if (d.readonly && !d.saved) {
    showKhongDien();
  } else if (d.saved && !state.editing) {
    showSaved("Timesheet " + d.nhan.toLowerCase() + " đã được ghi nhận", "", false);
  } else {
    render();
  }
}

// Ngày không cần điền (cuối tuần / lễ / nghỉ cả ngày / chỉ có OT): chỉ hiện lý do, không có form
function showKhongDien() {
  var d = cur();
  $("app").innerHTML = dayBarHtml() + '<p class="sub">' + esc(state.hoTen) + '</p><p class="note warn">' +
    esc(d.canhBao || "Ngày này không cần điền timesheet.") + '</p><button id="closeBtn" class="secondary">Đóng</button>';
  bindDayBar();
  $("closeBtn").addEventListener("click", function () { tg.close(); });
}

// Màn "đã ghi nhận": hiện bản timesheet của ngày đang xem + giờ ghi nhận, kèm nút Thay đổi (còn trong hạn sửa)
function khoiDaLuuHtml(list) {
  var html = "";
  (list || []).forEach(function (e) {
    var p = state.byId[e.projectId];
    // Tin dữ liệu server gửi kèm; chỉ dùng danh sách dự án trong máy khi server không gửi trường đó
    var ten = e.ten !== undefined ? e.ten : (p ? p.TenDuAn : e.projectId);
    var moTa = e.moTa !== undefined ? e.moTa : (p ? p.MoTa : "");
    html += '<div class="row"><div class="info"><div class="name">' + esc(ten) + '</div>' +
      '<div class="desc">' + esc(moTa || "(Chưa có mô tả)") + '</div></div>' +
      '<div class="name">' + fmt(e.soGio) + 'h</div></div>';
  });
  return html;
}

function showSaved(title, note, isWarning) {
  var d = cur();
  var s = d.saved;
  var root = $("app");
  var html = dayBarHtml() + '<p class="savedtitle">' + esc(title) + '</p><p class="sub">' + esc(state.hoTen) +
    (s.savedAt ? ' · Ghi nhận lúc ' + esc(s.savedAt) : '') + '</p>';
  if (note) html += '<p class="note' + (isWarning ? ' warn' : '') + '">' + esc(note) + '</p>';
  var totW = tongRows(s.entries), totO = tongRows(s.otEntries);
  var coKhoiOt = (s.otEntries || []).length > 0 || coOt(d);
  var lechW = !d.readonly && typeof d.available === "number" && Math.abs(totW - d.available) > 1e-9;
  var lechO = !d.readonly && ((coOt(d) && Math.abs(totO - d.otGio) > 1e-9) || (!coOt(d) && totO > 0));
  var lech = lechW || lechO;
  if (coKhoiOt) {
    html += '<h4 class="khoi">Giờ làm việc</h4>' + khoiDaLuuHtml(s.entries) +
      '<div id="total"><span>Tổng</span><span class="' + (lechW ? 'error' : 'ok') + '">' + fmt(totW) + 'h</span></div>' +
      '<h4 class="khoi">Giờ OT</h4>' + khoiDaLuuHtml(s.otEntries) +
      '<div id="totalO"><span>Tổng</span><span class="' + (lechO ? 'error' : 'ok') + '">' + fmt(totO) + 'h</span></div>';
  } else {
    html += khoiDaLuuHtml(s.entries) + '<div id="total"><span>Tổng</span><span class="' + (lech ? 'error' : 'ok') + '">' + fmt(totW) + 'h</span></div>';
  }
  if (d.readonly) {
    html += '<p class="note warn">' + esc(d.canhBao || "Ngày này không cần điền timesheet, bản đã lưu chỉ để xem.") + '</p>';
  } else if (lech) {
    var ctW = 'hiện là ' + fmt(d.available) + 'h' + (d.lyDo ? ' (' + esc(d.lyDo) + ')' : '') + ' nhưng bạn đã điền ' + fmt(totW) + 'h';
    var ctO = 'hiện là ' + fmt(coOt(d) ? d.otGio : 0) + 'h nhưng bạn đã điền ' + fmt(totO) + 'h';
    var cau = lechW && !lechO ? 'Giờ khả dụng ngày này ' + ctW
      : !lechW && lechO ? 'Giờ OT ngày này ' + ctO
      : 'Số giờ của ngày này đã thay đổi: giờ khả dụng ' + ctW + '; giờ OT ' + ctO;
    html += '<p class="note warn">' + cau + '. Bấm "Thay đổi" để cập nhật lại cho khớp.</p>';
  }
  if (!d.readonly) html += '<button id="editBtn">✏️ Thay đổi</button>';
  html += '<button id="closeBtn" class="secondary">Đóng</button>';
  if (!d.readonly) html += '<p class="hint" style="color:var(--tg-theme-hint-color,#888);margin-top:10px">Bạn có thể thay đổi timesheet này đến ' + esc(d.han) + '.</p>';
  root.innerHTML = html;
  bindDayBar();
  if ($("editBtn")) $("editBtn").addEventListener("click", onEdit);
  $("closeBtn").addEventListener("click", function () { tg.close(); });
}

// Vào chế độ thay đổi: form điền sẵn đúng các dự án + giờ đã lưu (cả 2 khối)
// Danh sách {projectId, soGio, ten, moTa} -> các dòng của form (dự án đã đóng vẫn hiện được tên)
function doiSangRows(list) {
  return (list || []).map(function (e) {
    if (!state.byId[e.projectId]) {
      // dự án đã bị đóng sau khi lưu: vẫn hiện được tên, server sẽ báo nếu nhân viên giữ nguyên nó khi lưu
      state.byId[e.projectId] = { ProjectID: e.projectId, TenDuAn: e.ten, MoTa: e.moTa };
    }
    return { projectId: e.projectId, gio: e.soGio };
  });
}

function onEdit() {
  var s = cur().saved;
  state.rows = doiSangRows(s.entries);
  state.otRows = doiSangRows(s.otEntries);
  if (state.rows.length === 0) state.rows = [newRow()];
  if (state.otRows.length === 0) state.otRows = [newRow()];
  state.editing = true;
  render();
}

function onCancelEdit() {
  state.editing = false;
  state.rows = [newRow()];
  state.otRows = [newRow()];
  delete state.drafts[cur().ngay];
  showSaved("Timesheet " + cur().nhan.toLowerCase() + " đã được ghi nhận", "", false);
}

function showErrorWithBack(text) {
  showMessage(text, "error");
  var btn = document.createElement("button");
  btn.id = "backBtn2";
  btn.textContent = "Quay lại sửa";
  btn.addEventListener("click", render);
  $("app").appendChild(btn);
}

if (!tg) {
  showVersion(null, false);
  showMessage("Không tải được Telegram SDK - hãy mở Mini App từ trong Telegram.", "error");
} else {
  tg.ready();
  tg.expand();
  init();
}
</script>
</body>
